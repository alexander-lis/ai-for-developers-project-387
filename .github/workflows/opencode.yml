name: opencode

# Agent called from a comment: `/oc <task>` or `/opencode <task>` in an issue,
# a PR discussion or on a line of a PR diff. `created` only: editing a comment does not rerun it.
# No workflow-level concurrency: a plain comment would queue behind the agent and could replace
# a pending command. Only the agent job is serialized per issue or PR, see jobs.opencode.
# jactionlint ignore=concurrency-limits
on:
  # Runs with the model key in the default branch context. Mitigated: the job `if` admits only
  # owner/member/collaborator commands, OpenCode checks write access, fork PRs are refused below.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# The run budget of a PR is counted by this title in the Actions history: an admitted command
# gets `opencode PR #<n>`, anything else a title that is never counted.
# Keep the condition in sync with jobs.budget.if.
run-name: >-
  ${{
    ((startsWith(github.event.comment.body, '/oc ') ||
      startsWith(github.event.comment.body, '/opencode ') ||
      contains(github.event.comment.body, ' /oc ') ||
      contains(github.event.comment.body, ' /opencode ') ||
      contains(github.event.comment.body, format('{0}/oc ', fromJSON('"\n"'))) ||
      contains(github.event.comment.body, format('{0}/opencode ', fromJSON('"\n"')))) &&
     contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
              github.event.comment.author_association) &&
     github.event.comment.user.type != 'Bot')
    && format('opencode {0} #{1}',
              (github.event.issue.pull_request || github.event.pull_request) && 'PR' || 'issue',
              github.event.issue.number || github.event.pull_request.number)
    || 'opencode: not a command'
  }}

permissions: {}

env:
  RUN_LIMIT: 3 # agent runs per PR, the attempt of the current run included

jobs:
  # Decides before any model call whether the command may run. On a PR every admitted command
  # spends one attempt: replies to discussion and line comments, cancelled and timed out runs,
  # and every Re-run (run_attempt). The counter is the Actions history of this workflow, which
  # neither the App token (actions: read) nor GITHUB_TOKEN can rewrite; comments are reports only.
  budget:
    # Runs only on a command from a trusted human: owner, org member or collaborator.
    # Bots are skipped so the agent never answers its own comments. Fork authors are not
    # trusted, so their comments never reach the model key.
    # A command is `/oc` or `/opencode` as a word: at the start of the comment, after a space or
    # a line break, followed by a space. A link like github.com/octocat or a word like /ocean
    # spends nothing. fromJSON('"\n"') is a line break: expressions have no escapes.
    if: >-
      (startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, '/opencode ') ||
       contains(github.event.comment.body, ' /oc ') ||
       contains(github.event.comment.body, ' /opencode ') ||
       contains(github.event.comment.body, format('{0}/oc ', fromJSON('"\n"'))) ||
       contains(github.event.comment.body, format('{0}/opencode ', fromJSON('"\n"')))) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the run history this budget is counted from
      pull-requests: read # head SHA and the fork check
    outputs:
      allowed: ${{ steps.count.outputs.allowed }}
      used: ${{ steps.count.outputs.used }}
      head_sha: ${{ steps.count.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      IS_PR: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'true' || 'false' }}
      # Quoted: unquoted, YAML reads ` #...` as a comment and the title loses the number.
      RUN_NAME: "opencode PR #${{ github.event.issue.number || github.event.pull_request.number }}"
    steps:
      # On a PR the agent checks out its branch and may run its code with the model key in env.
      # Code from a fork is untrusted even when a collaborator calls the agent on it.
      - name: Refuse pull requests from forks
        if: env.IS_PR == 'true'
        run: |
          fork=$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          if [ "$fork" != false ]; then
            echo "::error::PR #$NUMBER comes from a fork, the agent is not run on it"
            exit 1
          fi

      - name: Count agent runs on this PR
        id: count
        shell: bash # pipefail: a failed history request fails the step instead of counting 0
        run: |
          if [ "$IS_PR" != true ]; then
            echo "Issue #$NUMBER: no run budget, it applies to PRs"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_sha=$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          # Every run of this workflow with this PR's title, this one included; run_attempt
          # counts its Re-runs. Commands refused by the budget count too: once exhausted, the
          # budget stays exhausted. A run skipped as a whole never reached the budget.
          used=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/opencode.yml/runs?per_page=100" \
            --jq ".workflow_runs[]
                  | select(.display_title == \"$RUN_NAME\" and .conclusion != \"skipped\")
                  | .run_attempt" \
            | awk '{ sum += $1 } END { print sum + 0 }')
          # This run is always in the history: zero means the query or the title is wrong,
          # and a broken counter must not let the agent run.
          if [ "$used" -lt 1 ]; then
            echo "::error::Run '$RUN_NAME' not found in the history, the budget cannot be counted"
            exit 1
          fi
          echo "used=$used" >> "$GITHUB_OUTPUT"
          echo "PR #$NUMBER: attempt $used of $RUN_LIMIT, head $head_sha"
          if [ "$used" -le "$RUN_LIMIT" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PR #$NUMBER has used its $RUN_LIMIT agent runs, the model is not called"
          fi

  opencode:
    needs: budget
    if: needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    # The agent step has its own, shorter limit, so a timeout is still classified below.
    timeout-minutes: 55
    # One run per issue or PR at a time; a new command waits instead of cancelling the current one.
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read # checkout
      id-token: write # OIDC token, exchanged for the OpenCode GitHub App token
      pull-requests: read # `gh pr view` and `gh pr checks` in the agent shell
      issues: write # `gh` in the agent shell: to-spec and to-tickets publish issues and labels
    outputs:
      reason: ${{ steps.classify.outputs.reason }}
    env:
      AGENT_TIMEOUT_MINUTES: 45
    steps:
      - name: Remember the start
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the model key
        id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Secret OPENROUTER_API_KEY is not set"
            exit 1
          fi

      # The agent runs the project's checks itself (`mise run check`, AGENTS.md):
      # the same tools as CI and locally.
      - name: Setup mise
        id: mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        id: install
        run: |
          mise run install
          npx --prefix frontend playwright install --with-deps --only-shell chromium

      # Locally the skills come from the global Claude Code plugin mattpocock-skills,
      # the runner starts clean. Same commit as plugin 1.3.1; implement-spec calls tdd
      # and code-review, triage calls grilling and domain-modeling.
      - name: Install skills
        id: skills
        shell: bash # pipefail: a failed download fails the step
        env:
          SKILLS_SHA: 49dd158d1076134a641b33efb035946536778336
        run: |
          mkdir -p "$RUNNER_TEMP/skills" ~/.config/opencode/skills
          curl -fsSL "https://codeload.github.com/mattpocock/skills/tar.gz/$SKILLS_SHA" \
            | tar -xz -C "$RUNNER_TEMP/skills" --strip-components=1
          for skill in engineering/to-spec engineering/to-tickets engineering/implement-spec \
            engineering/tdd engineering/code-review engineering/triage \
            engineering/domain-modeling productivity/grilling; do
            cp -R "$RUNNER_TEMP/skills/skills/$skill" ~/.config/opencode/skills/
          done
          ls ~/.config/opencode/skills

      # The shell of the agent gets no model key: see the plugin. Taken from the checkout, which
      # for issue_comment events is the default branch.
      - name: Install the shell env plugin
        id: plugin
        run: |
          mkdir -p ~/.config/opencode/plugin
          cp .github/opencode-cli/plugin/scrub-env.js ~/.config/opencode/plugin/

      - name: Run OpenCode
        id: agent
        timeout-minutes: ${{ fromJSON(env.AGENT_TIMEOUT_MINUTES) }}
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c # v1.19.5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The App token is used by OpenCode itself; `gh` in the agent shell needs its own.
          GH_TOKEN: ${{ github.token }}
          # Nobody answers permission prompts in CI: an `ask` hangs the run until the timeout.
          # Rules are matched last-first, so deny everything outside the repo, then re-allow
          # the skills and OpenCode's temp dir. A wrong path now fails the tool call instead.
          OPENCODE_PERMISSION: >-
            {"external_directory": {"*": "deny", "~/.config/opencode/skills/*": "allow",
            "/tmp/opencode/*": "allow"}, "doom_loop": "deny"}
        with:
          # provider/model: OpenRouter, Claude Haiku 5.5, cheap with reliable tool calls.
          model: openrouter/anthropic/claude-haiku-5.5
          mentions: /opencode,/oc
          # No `share`: the action ignores it, session sharing was discontinued.

      # The reason the report job publishes. A step killed by its timeout-minutes may end as
      # failure or cancelled, so the elapsed time tells a timeout from other failures.
      - name: Classify the outcome
        id: classify
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          KEY: ${{ steps.key.outcome }}
          MISE: ${{ steps.mise.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SKILLS: ${{ steps.skills.outcome }}
          PLUGIN: ${{ steps.plugin.outcome }}
          AGENT: ${{ steps.agent.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          elapsed=$(( $(date +%s) - STARTED_AT ))
          if [ "$AGENT" = success ]; then
            reason=success
          elif [ "$JOB_STATUS" = cancelled ] && [ "$elapsed" -lt $(( AGENT_TIMEOUT_MINUTES * 60 - 30 )) ]; then
            # Cancelled by a human, also while the tools were still being set up.
            reason=cancelled
          elif [ "$AGENT" = skipped ]; then
            # The agent never started: a setup step or the model key failed.
            reason=infra
          elif [ "$elapsed" -ge $(( AGENT_TIMEOUT_MINUTES * 60 - 30 )) ]; then
            reason=timeout
          else
            reason=agent_failed
          fi
          echo "steps: checkout=$CHECKOUT key=$KEY mise=$MISE install=$INSTALL skills=$SKILLS plugin=$PLUGIN agent=$AGENT"
          echo "elapsed ${elapsed}s, reason $reason"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

  # Publishes why the agent did not finish: budget exhausted, timeout, setup failure or another
  # error. A job of its own, without the model, so it runs after the agent has stopped and has
  # its own time limit. On success the agent has already answered in the thread itself.
  report:
    needs: [budget, opencode]
    if: >-
      always() && needs.budget.result != 'skipped' &&
      needs.opencode.outputs.reason != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # the report comment in an issue
      pull-requests: write # the report comment in a PR
    steps:
      - name: Publish the outcome
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          BUDGET: ${{ needs.budget.result }}
          ALLOWED: ${{ needs.budget.outputs.allowed }}
          USED: ${{ needs.budget.outputs.used }}
          HEAD_SHA: ${{ needs.budget.outputs.head_sha }}
          AGENT_RESULT: ${{ needs.opencode.result }}
          REASON: ${{ needs.opencode.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          if [ "$ALLOWED" = false ]; then
            reason=limit_exhausted
            detail="Предел запусков агента на этот PR исчерпан: допущенных команд $USED при пределе $RUN_LIMIT, с этой включительно. Модель не вызывалась."
          elif [ "$BUDGET" != success ]; then
            reason=infra
            detail="Проверка бюджета или форка не прошла, агент не запускался."
          else
            case "$REASON" in
              timeout) reason=timeout; detail="Вызов агента превысил свой тайм-аут и был остановлен." ;;
              infra) reason=infra; detail="Подготовка окружения не прошла или нет ключа модели, агент не запускался." ;;
              agent_failed) reason=agent_failed; detail="Агент завершился ошибкой." ;;
              cancelled) reason=cancelled; detail="Прогон отменён." ;;
              *) reason=unknown; detail="Задание агента завершилось как \`$AGENT_RESULT\` без классификации, причину нужно проверить по логам." ;;
            esac
          fi
          # An issue has no head commit of its own, so its report names none.
          sha_line=""
          [ -n "$HEAD_SHA" ] && sha_line="- Последний SHA PR: \`$HEAD_SHA\`"
          body=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n' \
            "**Агент: нужен человек**" \
            "$detail" \
            "- Причина: \`$reason\`" \
            "$sha_line" \
            "- Логи: $RUN_URL" \
            "- Следующее действие выбирает человек: доработать вручную, пересмотреть подход или закрыть.")
          echo "$body"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "$body"
